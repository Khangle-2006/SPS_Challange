name: Source and portable pipeline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r environments/locks/core-linux-py312.txt
      - run: python -m pip check
      - run: python tools/verify_source.py
      - run: python -m unittest discover -s tools
      - run: python -m unittest test_score_round1
      - run: python tools/fetch_inference_assets.py
